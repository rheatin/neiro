[package]
name = "neiro-ui"
version = "0.3.0"
edition = "2021"
publish = false

# A UI host for the Neiro engine's Base layer, drawn by Native Shell in TSX.
# The Rust crate opens Base through its C ABI at run time and speaks to the
# TSX interface only through the exports in `src/lib.rs`.
#
# The `nsh-*` crates are taken from the same release as this repository's
# `nsh` CLI (v0.6.1), so the app and the generated hosts share one `nsh-core`.
# Base is opened at run time on desktop, never linked: the DLL sits beside the
# binary and the UI still builds where the engine was never built. On iOS the
# core is linked at build time, so the loader is not compiled there at all.
[target.'cfg(not(target_os = "ios"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-avf-audio = "0.3.2"
# The interruption observer is a block; its notification and number types
# come from Foundation. Both are already in the graph through avf-audio, so
# naming them here adds no new download.
block2 = "0.6"
# The folder picker is a UIKit view controller, and its bookmark is NSURL
# data. `dispatch2` already reaches this build through nsh, so the main-queue
# hop adds no download either.
objc2-ui-kit = { version = "0.3.2", features = [
    "UIApplication",
    "UIPresentationController",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIDocumentPickerViewController",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSURL",
] }
dispatch2 = "0.3"

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
# The online lyrics search. Base uses the same client for the remote server, so
# the version matches and the lock file gains nothing new.
ureq = { version = "3.5.1", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[lib]
name = "neiro_ui"
crate-type = ["lib"]

[profile.release]
opt-level = 3
lto = "thin"
strip = "none"
