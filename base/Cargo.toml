[package]
name = "neiro-base"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "neiro_base"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
neiro-audio = { path = "../binding" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The library layer. `bundled` compiles SQLite from source into the crate, which
# is what makes it link on iOS: the App Store build is a static library, and a
# system SQLite that has to be linked by the host is one more thing to get wrong
# per platform. It costs a C compile on every clean build.
rusqlite = { version = "0.32", features = ["bundled"] }

