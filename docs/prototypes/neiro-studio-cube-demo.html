<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEIRO BC-1 + K.O.-AMP 35 — Studio Hardware Demo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --cobalt-top: #0c3568;
    --cobalt-mid: #08274f;
    --cobalt-deep: #051833;
    --abs-grey: #d5d7dc;
    --abs-dark: #202227;
    --orange: #ff5400;
    --crimson: #ff2618;
    --amber: #ff9c40;
    --ink: #111318;
    --hud-bg: rgba(8, 22, 44, 0.78);
    --hud-border: rgba(255, 255, 255, 0.14);
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, ui-monospace, monospace;
    --sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--sans);
    color: #eef1f7;
    background: radial-gradient(ellipse at 50% 35%, var(--cobalt-top) 0%, var(--cobalt-mid) 48%, var(--cobalt-deep) 100%);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle studio carpet grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.16;
    background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 0);
    background-size: 4px 4px;
    z-index: 0;
  }

  /* Top Hardware HUD */
  .top-hud {
    position: fixed;
    top: 14px;
    left: 16px;
    right: 16px;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .hud-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(14px);
    border-radius: 10px;
    padding: 6px 10px;
    pointer-events: auto;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .brand-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: #f3f5fa;
    padding-right: 6px;
  }
  .brand-led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--crimson);
    box-shadow: 0 0 8px var(--crimson);
  }
  .brand-led.paused {
    background: #6a2222;
    box-shadow: none;
  }

  .seg-btn, .pill-btn {
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #cfd6e4;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .seg-btn:hover, .pill-btn:hover {
    background: rgba(255,255,255,0.14);
    color: #fff;
  }
  .seg-btn.active {
    background: #f0f1f3;
    color: var(--ink);
    border-color: #fff;
  }
  .pill-btn.orange-active {
    background: var(--orange);
    color: #fff;
    border-color: #ff7a33;
    box-shadow: 0 0 14px rgba(255, 84, 0, 0.45);
  }
  .pill-btn.crimson-active {
    background: rgba(255, 38, 24, 0.2);
    color: #ff8e86;
    border-color: rgba(255, 38, 24, 0.65);
  }

  .now-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: #b7c2d6;
    padding: 0 4px;
  }
  .now-strip strong {
    color: #fff;
    font-weight: 600;
    max-width: 210px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .now-time {
    color: #ff6256;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* Main Viewport */
  .stage-root {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #webgl-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #webgl-stage:active { cursor: grabbing; }
  #webgl-stage.hidden { display: none; }

  /* Mode 2: Studio Plate + Blueprint Overlay */
  #plate-mode {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 68px 20px 84px;
    gap: 18px;
  }
  #plate-mode.active { display: flex; }

  .plate-viewport {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    height: 100%;
    max-width: 100%;
    min-width: 0;
  }
  .plate-box {
    position: relative;
    aspect-ratio: 1 / 1;
    height: min(100%, 740px);
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.14);
    background: #0d1626;
  }
  .plate-box.wide {
    aspect-ratio: 3 / 2;
    height: min(92%, 620px);
  }
  .plate-img, .plate-live-canvas, .plate-hotspots, .plate-callouts {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .plate-img {
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .plate-live-canvas {
    pointer-events: none;
  }
  .plate-hotspots { z-index: 5; }
  .plate-callouts { z-index: 8; pointer-events: none; }

  .hotspot {
    position: absolute;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .hotspot:hover {
    background: rgba(255, 84, 0, 0.12);
    border-color: rgba(255, 84, 0, 0.55);
  }
  .hotspot.highlighted {
    background: rgba(255, 84, 0, 0.22);
    border-color: var(--orange);
    box-shadow: 0 0 0 2px rgba(255, 84, 0, 0.35);
  }

  .callout-pin {
    position: absolute;
    transform: translate(-50%, -50%);
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border-radius: 999px;
    background: rgba(17, 19, 24, 0.9);
    border: 1.5px solid var(--orange);
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.14s ease, background 0.14s ease;
  }
  .callout-pin:hover, .callout-pin.active {
    transform: translate(-50%, -50%) scale(1.18);
    background: var(--orange);
    color: #fff;
  }

  /* Blueprint Spec Inspector Drawer */
  .inspector-panel {
    width: 340px;
    max-width: 34vw;
    height: 100%;
    max-height: 740px;
    background: rgba(10, 20, 38, 0.88);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(16px);
    border-radius: 14px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 22px 54px rgba(0,0,0,0.45);
  }
  .inspector-panel.open { display: flex; }
  .inspector-head {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .inspector-head h3 {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #fff;
  }
  .inspector-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .spec-item {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  .spec-item:hover, .spec-item.active {
    border-color: var(--orange);
    background: rgba(255, 84, 0, 0.12);
  }
  .spec-item-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .spec-num {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--orange);
    color: #fff;
  }
  .spec-name {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .spec-route {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: #9bb0d1;
  }
  .spec-desc {
    font-size: 11px;
    line-height: 1.45;
    color: #c5d0e3;
  }

  /* Bottom Face Navigation Dock */
  .bottom-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(14px);
    padding: 6px 8px;
    border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    max-width: calc(100vw - 24px);
    overflow-x: auto;
  }
  .face-btn {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #d4dceb;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .face-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .face-btn.active {
    background: #f0f1f3;
    color: var(--ink);
    border-color: #fff;
  }
  .face-btn.dossier-btn {
    border-color: rgba(255, 84, 0, 0.45);
    color: #ffb28b;
  }
  .face-btn.dossier-btn:hover {
    background: var(--orange);
    color: #fff;
  }

  /* Toast Feedback */
  .toast {
    position: fixed;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    z-index: 40;
    background: rgba(14, 18, 26, 0.92);
    border: 1px solid rgba(255, 84, 0, 0.55);
    color: #f5f7fc;
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 13px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Foreground Physical Album Dossier Unfold Modal */
  .dossier-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(4, 14, 30, 0.72);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .dossier-backdrop.open { display: flex; }

  .dossier-desk {
    width: min(880px, 100%);
    max-height: 90vh;
    display: grid;
    grid-template-columns: 310px 1fr;
    background: #c7aa82;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.18);
    animation: dossierIn 0.22s cubic-bezier(0.2, 0.85, 0.3, 1);
  }
  @keyframes dossierIn {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .sleeve-pocket {
    background: linear-gradient(155deg, #b89566 0%, #9b794d 100%);
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    border-right: 2px dashed rgba(45, 30, 14, 0.28);
    position: relative;
  }
  .sleeve-stamp {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: rgba(30, 20, 10, 0.75);
    border: 1px solid rgba(30, 20, 10, 0.35);
    padding: 3px 7px;
    border-radius: 3px;
  }
  .cd-disc {
    width: 196px;
    height: 196px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, transparent 0 18px, rgba(255,255,255,0.22) 19px 21px, transparent 22px),
      conic-gradient(from 40deg, #3c5472, #86a6c9, #2f435d, #a5c3df, #354b67, #7798bc, #3c5472);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.36), inset 0 0 0 2px rgba(255,255,255,0.35);
    position: relative;
    cursor: pointer;
    transition: transform 0.22s ease;
  }
  .cd-disc:hover { transform: translateY(-6px) rotate(12deg); }
  .cd-disc::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 34px; height: 34px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #9b794d;
    border: 4px solid rgba(255,255,255,0.5);
  }
  .load-disc-btn {
    width: 100%;
    border: none;
    background: var(--orange);
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 11px 14px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
  }
  .load-disc-btn:hover { background: #ff691f; }

  .booklet-page {
    background: #f3f1eb;
    color: #1a1c20;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .booklet-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    border-bottom: 1.5px solid #1a1c20;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .booklet-kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #666;
    margin-bottom: 4px;
  }
  .booklet-title {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .booklet-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: #4b5260;
    margin-top: 4px;
  }
  .close-dossier {
    border: 1px solid #1a1c20;
    background: transparent;
    color: #1a1c20;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .close-dossier:hover { background: #1a1c20; color: #fff; }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .track-row {
    display: grid;
    grid-template-columns: 32px 1fr 72px 54px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .track-row:hover { background: rgba(0, 0, 0, 0.05); }
  .track-row.playing {
    background: #1a1c20;
    color: #fff;
  }
  .track-num { font-family: var(--mono); font-size: 11px; opacity: 0.7; }
  .track-fmt { font-family: var(--mono); font-size: 10px; opacity: 0.75; text-align: right; }
  .track-dur { font-family: var(--mono); font-size: 11px; text-align: right; }

  .booklet-notes {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed rgba(0, 0, 0, 0.22);
    font-size: 11.5px;
    line-height: 1.5;
    color: #464c56;
  }

  @media (max-width: 860px) {
    .top-hud { flex-wrap: wrap; }
    .now-strip { display: none; }
    .inspector-panel {
      position: fixed;
      right: 12px;
      top: 66px;
      bottom: 74px;
      width: min(320px, calc(100vw - 24px));
      max-width: none;
      z-index: 35;
    }
    .dossier-desk { grid-template-columns: 1fr; }
    .sleeve-pocket { border-right: none; border-bottom: 2px dashed rgba(45,30,14,0.28); gap: 14px; }
    .cd-disc { width: 130px; height: 130px; }
  }
</style>
</head>
<body>

<header class="top-hud">
  <div class="hud-group">
    <div class="brand-tag">
      <span id="status-led" class="brand-led"></span>
      <span>NEIRO BC-1 // AMP-35</span>
    </div>
    <button id="mode-3d-btn" class="seg-btn active" type="button">3D 实体六面体</button>
    <button id="mode-plate-btn" class="seg-btn" type="button">正视实体机 + 标注</button>
  </div>

  <div class="hud-group now-strip">
    <span id="hud-album">ARCHIVE 01</span>
    <span>/</span>
    <strong id="hud-track">02 · SATELLITE TELEMETRY</strong>
    <span id="hud-time" class="now-time">01:42</span>
    <span id="hud-spec">96.0kHz · 24b</span>
  </div>

  <div class="hud-group">
    <button id="grille-cycle-btn" class="pill-btn crimson-active" type="button" title="切换右面穿孔网罩频谱模式">网罩频谱: BARS</button>
    <button id="inspect-btn" class="pill-btn" type="button" title="快捷键 I">功能标注 OFF</button>
    <button id="sfx-btn" class="pill-btn" type="button">SFX ON</button>
  </div>
</header>

<main class="stage-root">
  <div id="webgl-stage"></div>

  <section id="plate-mode" aria-label="正视实体机与功能标注模式">
    <div class="plate-viewport">
      <div id="plate-box" class="plate-box">
        <img id="plate-img" class="plate-img" src="./assets/hero-34.jpg" alt="NEIRO BC-1 + AMP-35 Studio View" />
        <canvas id="plate-live-canvas" class="plate-live-canvas" width="1024" height="1024"></canvas>
        <div id="plate-hotspots" class="plate-hotspots"></div>
        <div id="plate-callouts" class="plate-callouts"></div>
      </div>
    </div>

    <aside id="inspector-panel" class="inspector-panel">
      <div class="inspector-head">
        <h3 id="inspector-title">CONTROL BLUEPRINT</h3>
        <button id="inspector-close" class="pill-btn" type="button">收起</button>
      </div>
      <div id="inspector-list" class="inspector-list"></div>
    </aside>
  </section>
</main>

<nav class="bottom-dock" aria-label="六面体视角切换">
  <button class="face-btn active" data-face="hero" type="button">3/4 总览</button>
  <button class="face-btn" data-face="top" type="button">顶面 · 播放</button>
  <button class="face-btn" data-face="front" type="button">正面 · 专辑</button>
  <button class="face-btn" data-face="right" type="button">右面 · 输出与频谱</button>
  <button class="face-btn" data-face="left" type="button">左面 · 歌词队列</button>
  <button class="face-btn" data-face="back" type="button">背面 · I/O</button>
  <button id="open-dossier-btn" class="face-btn dossier-btn" type="button">抽碟展开</button>
</nav>

<div id="toast" class="toast"></div>

<!-- Foreground Physical Album Dossier Unfold -->
<div id="dossier-backdrop" class="dossier-backdrop" role="dialog" aria-modal="true">
  <div class="dossier-desk">
    <div class="sleeve-pocket">
      <span class="sleeve-stamp" id="dossier-code">NEIRO ARCHIVE 01</span>
      <div class="cd-disc" id="dossier-disc" title="点击装载光盘并播放"></div>
      <button id="load-disc-btn" class="load-disc-btn" type="button">LOAD DISC ▶ 装入播放</button>
    </div>
    <div class="booklet-page">
      <div class="booklet-head">
        <div>
          <div class="booklet-kicker" id="dossier-kicker">BROADCAST SERIES · KRAFT SLEEVE + BOOKLET</div>
          <h2 class="booklet-title" id="dossier-title">TOKYO BROADCAST</h2>
          <div class="booklet-meta" id="dossier-meta">PCM 96.0 kHz / 24-bit · DR14 · LOCAL</div>
        </div>
        <button id="close-dossier-btn" class="close-dossier" type="button">收起 ESC</button>
      </div>
      <div id="dossier-tracks" class="track-list"></div>
      <div id="dossier-notes" class="booklet-notes"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   1. DEMO DATA & SHARED STUDIO COORDINATE MAP
   ========================================================= */
const ALBUMS = [

function imgToFaceRect(face, r) {
  const c = FACE_CROPS[face];
  return {
    x: (r.x - c.x) / c.w,
    y: (r.y - c.y) / c.h,
    w: r.w / c.w,
    h: r.h / c.h
  };
}
function imgToFacePt(face, p) {
  const c = FACE_CROPS[face];
  return { x: (p.x - c.x) / c.w, y: (p.y - c.y) / c.h };
}

function currentAlbum() { return ALBUMS[state.albumIdx]; }
function currentTrack() { return currentAlbum().tracks[state.trackIdx] || currentAlbum().tracks[0]; }
function filteredAlbums() {
  if (state.filter === 'ALL') return ALBUMS;
  return ALBUMS.filter(a => a.format === state.filter);
}

let audioCtx = null;
function playClickFoley(pitch = 620) {
  if (!state.sfx) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.018);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.022);
  } catch {}
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

   ========================================================= */
function togglePlay() {
  playClickFoley(520);
  state.playing = !state.playing;
  syncHud();
  toast(state.playing ? '▶ 正在播放：' + currentTrack().title : '⏸ 已暂停');
}
function jumpTrack(idx) {
  playClickFoley(680);
  const tracks = currentAlbum().tracks;
  state.trackIdx = ((idx % tracks.length) + tracks.length) % tracks.length;
  state.elapsed = 0;
  state.playing = true;
  syncHud();
  toast('切至第 ' + String(state.trackIdx + 1).padStart(2, '0') + ' 轨：' + currentTrack().title);
}
function seekBy(sec) {
  playClickFoley(760);
  const dur = currentTrack().dur;
  state.elapsed = Math.max(0, Math.min(dur - 1, state.elapsed + sec));
  syncHud();
  toast('JOG 寻道：' + fmtTime(state.elapsed));
}
function triggerCue() {
  playClickFoley(700);
  const next = state.cueLit.findIndex(v => !v);
  const idx = next === -1 ? 0 : next;
  state.cueLit = state.cueLit.map((_, i) => i === idx);
  state.elapsed = [28, 74, 132][idx] % currentTrack().dur;
  syncHud();
  toast('CUE ' + (idx + 1) + ' 记忆点跳转：' + fmtTime(state.elapsed));
}
function cycleVarispeed() {
  playClickFoley(600);
  const presets = [100.0, 101.2, 98.8];
  const idx = (presets.indexOf(state.varispeed) + 1) % presets.length;
  state.varispeed = presets[idx];
  toast('VARISPEED: ' + state.varispeed.toFixed(1) + '%');
}
function cycleFilter() {
  playClickFoley(640);
  const order = ['ALL', 'PCM', 'DSD'];

  playClickFoley(720);
  const order = ['BARS', 'MIRROR', 'PEAK', 'OFF'];
  state.grilleMode = order[(order.indexOf(state.grilleMode) + 1) % order.length];
  syncHud();
  toast('穿孔网罩频谱模式：' + state.grilleMode);

    state.interlocks.UNITY = true;

function cycleInterlock() {
  playClickFoley(660);
  state.interlocks.DSP = !state.interlocks.DSP;

function fmtTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function syncHud() {
  const alb = currentAlbum();
  const trk = currentTrack();

/* Shared live overlay renderer:
   - mappedToCrop=true when painting onto 3D Cube Face CanvasTexture
   - mappedToCrop=false when painting onto Mode 2 Studio Plate overlay canvas */
function paintLiveTop(ctx, W, H, mappedToCrop) {
  const mapR = r => mappedToCrop ? imgToFaceRect('top', r) : r;
  const mapP = p => mappedToCrop ? imgToFacePt('top', p) : p;

  // 1. Spinning iridescent specular highlight on CD platter
  const cdC = mapP({ x: 0.675, y: 0.308 });
  const cdR = (mappedToCrop ? 0.173 / FACE_CROPS.top.w : 0.173) * W;
  ctx.save();
  ctx.translate(cdC.x * W, cdC.y * H);
  ctx.rotate(state.cdAngle);
  const grad = ctx.createLinearGradient(-cdR, -cdR * 0.3, cdR, cdR * 0.3);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.45, 'rgba(180,225,255,0.22)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.34)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, cdR * 0.92, 0, Math.PI * 2);
  ctx.arc(0, 0, cdR * 0.24, 0, Math.PI * 2, true);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // 2. Live 7-segment display readout
  const seg = mapR({ x: 0.160, y: 0.520, w: 0.595, h: 0.065 });
  ctx.save();
  ctx.fillStyle = 'rgba(10, 8, 10, 0.92)';
  ctx.fillRect(seg.x * W, seg.y * H, seg.w * W, seg.h * H);
  ctx.fillStyle = '#ff2a1a';
  ctx.shadowColor = '#ff2618';
  ctx.shadowBlur = 10;
  ctx.font = `bold ${Math.round(seg.h * H * 0.68)}px Consolas, monospace`;
  ctx.textBaseline = 'middle';
  const trk = String(state.trackIdx + 1).padStart(3, '0');
  const idx = String(state.albumIdx + 1).padStart(3, '0');
  const mm = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
  const ss = String(Math.floor(state.elapsed % 60)).padStart(2, '0');
  const txt = `${trk}  ${idx}  ${mm}:${ss}   ${state.varispeed.toFixed(1)}   ${state.levelDb.toFixed(1)}`;
  ctx.fillText(txt, (seg.x + 0.015 * seg.w) * W, (seg.y + seg.h * 0.54) * H);
  ctx.restore();

  // 3. Dual L/R meters
  const vu = mapR({ x: 0.780, y: 0.515, w: 0.042, h: 0.082 });
  ctx.save();
  ctx.fillStyle = 'rgba(10, 8, 10, 0.92)';
  ctx.fillRect(vu.x * W, vu.y * H, vu.w * W, vu.h * H);
  const lvlL = state.playing ? (0.45 + 0.45 * state.spectrum[3]) : 0.06;
  const lvlR = state.playing ? (0.45 + 0.45 * state.spectrum[6]) : 0.06;
  const drawBar = (bx, val) => {
    const segs = 7;
    const active = Math.round(val * segs);
    const sw = vu.w * W * 0.34;
    const sh = (vu.h * H) / (segs * 1.35);
    for (let i = 0; i < segs; i++) {
      ctx.fillStyle = i < active ? (i > 5 ? '#ff5400' : '#ff2618') : 'rgba(255,38,24,0.16)';
      ctx.fillRect(bx, (vu.y + vu.h) * H - (i + 1) * sh * 1.25 - 3, sw, sh);
    }
  };
  drawBar(vu.x * W + vu.w * W * 0.1, lvlL);
  drawBar(vu.x * W + vu.w * W * 0.54, lvlR);
  ctx.restore();

  // 4. CUE 1-3 red LEDs
  const cuePts = [{ x: 0.320, y: 0.735 }, { x: 0.400, y: 0.735 }, { x: 0.480, y: 0.735 }];
  cuePts.forEach((pt, i) => {
    const p = mapP(pt);
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, W * 0.0065, 0, Math.PI * 2);
    ctx.fillStyle = state.cueLit[i] ? '#ff2618' : '#321414';
    if (state.cueLit[i]) { ctx.shadowColor = '#ff2618'; ctx.shadowBlur = 10; }
    ctx.fill();
    ctx.restore();
  });
}

function paintLiveRight(ctx, W, H, mappedToCrop) {
  const mapR = r => mappedToCrop ? imgToFaceRect('right', r) : r;
  const mapP = p => mappedToCrop ? imgToFacePt('right', p) : p;

  // 1. 24x48 Backlit Perforated Speaker Grille LED Matrix Spectrum!
  if (state.grilleMode !== 'OFF') {
    const gr = mapR({ x: 0.160, y: 0.173, w: 0.328, h: 0.652 });
    const cols = 24;
    const rows = 48;
    const gx0 = gr.x * W;
    const gy0 = gr.y * H;
    const gw = gr.w * W;
    const gh = gr.h * H;
    const cellW = gw / cols;
    const cellH = gh / rows;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let c = 0; c < cols; c++) {
      const energy = state.spectrum[c];
      const peakRow = Math.floor(state.spectrumPeaks[c] * (rows - 1));
      const litRows = Math.floor(energy * rows);

      for (let r = 0; r < rows; r++) {
        let lit = false;
        let isPeak = false;

        if (state.grilleMode === 'BARS') {
          const fromBottom = rows - 1 - r;
          lit = fromBottom < litRows;
          isPeak = fromBottom === peakRow && peakRow > 1;
        } else if (state.grilleMode === 'MIRROR') {
          const distCenter = Math.abs(r - rows * 0.5);
          lit = distCenter < litRows * 0.48;
          isPeak = Math.abs(distCenter - peakRow * 0.48) < 0.7 && peakRow > 2;
        } else if (state.grilleMode === 'PEAK') {
          const fromBottom = rows - 1 - r;
          lit = fromBottom <= litRows && (fromBottom % 2 === 0 || fromBottom > litRows - 4);
          isPeak = fromBottom === peakRow;
        }

        if (!lit && !isPeak) continue; // Keep unlit perforations completely transparent!

        const cx = gx0 + c * cellW + cellW * 0.18;
        const cy = gy0 + r * cellH + cellH * 0.18;
        const cw = cellW * 0.64;
        const ch = cellH * 0.64;

        if (isPeak) {
          ctx.fillStyle = 'rgba(255, 195, 95, 0.95)';
          ctx.shadowColor = '#ff7b29';
          ctx.shadowBlur = 7;
        } else {
          const hot = 1 - r / rows;
          ctx.fillStyle = hot > 0.72 ? 'rgba(255, 84, 0, 0.9)' : 'rgba(255, 34, 22, 0.82)';
          ctx.shadowColor = '#ff2618';
          ctx.shadowBlur = 5;
        }
        ctx.fillRect(cx, cy, cw, ch);
      }
    }
    ctx.restore();
  }

  // 2. Dual PPM meters + 96.0 / 24 / 04.2 Telemetry
  const vu = mapR({ x: 0.562, y: 0.212, w: 0.052, h: 0.153 });
  ctx.save();
  ctx.fillStyle = 'rgba(10, 8, 10, 0.92)';
  ctx.fillRect(vu.x * W, vu.y * H, vu.w * W, vu.h * H);
  const pL = state.playing ? (0.38 + 0.56 * state.spectrum[2]) : 0.05;
  const pR = state.playing ? (0.38 + 0.56 * state.spectrum[5]) : 0.05;
  [pL, pR].forEach((val, ch) => {
    const segs = 12;
    const active = Math.round(val * segs);
    const bx = vu.x * W + (ch === 0 ? vu.w * W * 0.12 : vu.w * W * 0.56);
    const sw = vu.w * W * 0.32;
    const step = (vu.h * H) / segs;
    for (let i = 0; i < segs; i++) {
      ctx.fillStyle = i < active ? (i > 9 ? '#ff5400' : '#ff2618') : 'rgba(255,38,24,0.14)';
      ctx.fillRect(bx, (vu.y + vu.h) * H - (i + 1) * step + 1, sw, step * 0.72);
    }
  });

  const tel = mapR({ x: 0.695, y: 0.205, w: 0.108, h: 0.160 });
  ctx.fillStyle = 'rgba(10, 8, 10, 0.92)';
  ctx.fillRect(tel.x * W, tel.y * H, tel.w * W, tel.h * H);
  ctx.fillStyle = '#ff2a1a';
  ctx.shadowColor = '#ff2618';
  ctx.shadowBlur = 8;
  ctx.font = `bold ${Math.round(tel.h * H * 0.27)}px Consolas, monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(currentAlbum().rate.toFixed(1), (tel.x + tel.w * 0.92) * W, (tel.y + tel.h * 0.30) * H);
  ctx.fillText(String(currentAlbum().bits), (tel.x + tel.w * 0.92) * W, (tel.y + tel.h * 0.60) * H);
  ctx.fillText(state.interlocks.DIRECT ? '04.2' : '08.4', (tel.x + tel.w * 0.92) * W, (tel.y + tel.h * 0.90) * H);
  ctx.restore();

  // 3. 5 Interlock pinhole LEDs
  const ledXs = [0.573, 0.627, 0.682, 0.737, 0.792];
  const ledKeys = ['DSP', 'RATE', 'EXCL', 'UNITY', 'DIRECT'];
  ledXs.forEach((lx, i) => {
    const p = mapP({ x: lx, y: 0.404 });
    const on = state.interlocks[ledKeys[i]];
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, W * 0.0058, 0, Math.PI * 2);
    ctx.fillStyle = on ? '#ff2618' : '#2d1212';
    if (on) { ctx.shadowColor = '#ff2618'; ctx.shadowBlur = 9; }
    ctx.fill();
    ctx.restore();
  });
}

function paintLiveLeft(ctx, W, H, mappedToCrop) {
  const mapR = r => mappedToCrop ? imgToFaceRect('left', r) : r;
  const scr = mapR({ x: 0.186, y: 0.373, w: 0.258, h: 0.208 });
  const x = scr.x * W;
  const y = scr.y * H;
  const w = scr.w * W;
  const h = scr.h * H;

  ctx.save();
  ctx.fillStyle = '#0e1116';
  ctx.fillRect(x, y, w, h);

  ctx.fillStyle = '#ff5400';
  ctx.font = `bold ${Math.round(h * 0.09)}px Consolas, monospace`;
  ctx.fillText(`${state.leftTab} · ${fmtTime(state.elapsed)} · ${currentTrack().title}`, x + w * 0.06, y + h * 0.16);

  if (state.leftTab === 'LYRICS') {
    const activeLine = Math.floor((state.elapsed / 12) % LYRIC_LINES.length);
    for (let i = 0; i < 3; i++) {
      const line = LYRIC_LINES[(activeLine + i) % LYRIC_LINES.length];
      ctx.fillStyle = i === 0 ? '#f4f6fb' : 'rgba(205, 214, 230, 0.55)';
      ctx.font = `${i === 0 ? 'bold ' : ''}${Math.round(h * 0.088)}px Consolas, monospace`;
      ctx.fillText((i === 0 ? '> ' : '  ') + line.slice(7, 34), x + w * 0.06, y + h * (0.34 + i * 0.14));
    }
  } else {
    currentAlbum().tracks.slice(0, 3).forEach((t, i) => {
      ctx.fillStyle = i === state.trackIdx ? '#ff5400' : '#d5dce8';
      ctx.font = `bold ${Math.round(h * 0.088)}px Consolas, monospace`;
      ctx.fillText(`${String(i + 1).padStart(2, '0')} ${t.title.slice(0, 20)}`, x + w * 0.06, y + h * (0.34 + i * 0.14));
    });
  }

  // Live waveform bar at bottom of glass screen
  const bars = 24;
  const bw = (w * 0.88) / bars;
  for (let i = 0; i < bars; i++) {
    const bh = Math.max(2, state.spectrum[i] * h * 0.22);
    ctx.fillStyle = '#e7edf7';
    ctx.fillRect(x + w * 0.06 + i * bw, y + h * 0.88 - bh, bw * 0.65, bh);
  }
  ctx.restore();
}

/* =========================================================
   6. MODE 1: THREE.JS STUDIO-TEXTURED 3D CUBE

const CAMERA_PRESETS = {
  hero:  { az: 38 * Math.PI / 180,  el: 29 * Math.PI / 180 },
  top:   { az: 0,                   el: 88.5 * Math.PI / 180 },
  front: { az: 0,                   el: 0 },
  right: { az: 90 * Math.PI / 180,  el: 0 },
  left:  { az: -90 * Math.PI / 180, el: 0 },
  back:  { az: Math.PI,             el: 0 }
};

let renderer, scene, camera, cubeGroup;
let targetAz = CAMERA_PRESETS.hero.az;
let targetEl = CAMERA_PRESETS.hero.el;
let curAz = targetAz;
let curEl = targetEl;
let webglReady = false;

const faceCanvases = {};
const faceTextures = {};
const faceMeshes = [];

function createFaceLayer(key, width = 768, height = 768) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  faceCanvases[key] = canvas;
  faceTextures[key] = tex;
  return tex;
}

function update3DFaceTexture(key) {
  const canvas = faceCanvases[key];
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  if (key === 'back') {
    ctx.drawImage(backBaseCanvas, 0, 0, W, H);
    ctx.fillStyle = state.dipExclusive ? '#ff2618' : '#333';
    ctx.beginPath();
    ctx.arc(W * 0.86, H * 0.63, 7, 0, Math.PI * 2);
    ctx.fill();
  } else if (key === 'bottom') {
    ctx.fillStyle = '#c9ccd2';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1b1d22';
    ctx.fillRect(W * 0.22, H * 0.38, W * 0.56, H * 0.24);
    ctx.fillStyle = '#d5d7dc';
    ctx.font = 'bold 24px Consolas, monospace';
    ctx.fillText('NEIRO BC-1 // AMP-35', W * 0.28, H * 0.49);
    ctx.font = '16px Consolas, monospace';
    ctx.fillText('HOST CORE · SAFE RECOVERY BASEPLATE', W * 0.25, H * 0.56);
  } else {
    const img = IMAGES[key];
    const c = FACE_CROPS[key];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, c.x * img.naturalWidth, c.y * img.naturalHeight, c.w * img.naturalWidth, c.h * img.naturalHeight, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#d5d7dc';
      ctx.fillRect(0, 0, W, H);
    }
    if (key === 'top') paintLiveTop(ctx, W, H, true);
    if (key === 'front') paintLiveFront(ctx, W, H, true);
    if (key === 'right') paintLiveRight(ctx, W, H, true);
    if (key === 'left') paintLiveLeft(ctx, W, H, true);
  }
  faceTextures[key].needsUpdate = true;
}

function initThree() {
  const container = document.getElementById('webgl-stage');
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    camera = new THREE.PerspectiveCamera(34, container.clientWidth / container.clientHeight, 0.1, 100);
    updateCameraTransform();

    // 135-deg studio softbox + rim light
    const keyLight = new THREE.DirectionalLight(0xfff9f2, 1.55);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc2d8ff, 0.55);
    fillLight.position.set(-6, 3, -4);
    scene.add(fillLight);

    // Shadow catcher plane
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.ShadowMaterial({ opacity: 0.36 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -1.62, 0);
    floor.receiveShadow = true;
    scene.add(floor);

    cubeGroup = new THREE.Group();
    scene.add(cubeGroup);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd3d6dc, roughness: 0.78, metalness: 0.04 });
    const body = new THREE.Mesh(new RoundedBoxGeometry(3.0, 3.0, 3.0, 6, 0.12), bodyMat);
    body.castShadow = true;
    body.receiveShadow = true;
    cubeGroup.add(body);

    // BC-1 / AMP-35 horizontal seam collar
    const seamMat = new THREE.MeshStandardMaterial({ color: 0x3b4049, roughness: 0.5, metalness: 0.15 });
    const seam = new THREE.Mesh(new THREE.BoxGeometry(3.01, 0.025, 3.01), seamMat);
    seam.position.set(0, 1.05, 0);
    cubeGroup.add(seam);

    // 4 Signal-Orange Corner Snap Latches + 4 White Cylindrical Feet
    const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff5400, roughness: 0.42, metalness: 0.05 });
    const latchGeo = new THREE.BoxGeometry(0.11, 0.24, 0.14);
    [[-1.51, 1.12, 1.15], [1.51, 1.12, 1.15], [-1.51, 1.12, -1.15], [1.51, 1.12, -1.15]].forEach(([x, y, z]) => {
      const latch = new THREE.Mesh(latchGeo, orangeMat);
      latch.position.set(x, y, z);
      cubeGroup.add(latch);
    });

    const footMat = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, roughness: 0.6, metalness: 0.02 });
    const footGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.16, 20);
    [[-1.24, -1.56, 1.24], [1.24, -1.56, 1.24], [-1.24, -1.56, -1.24], [1.24, -1.56, -1.24]].forEach(([x, y, z]) => {
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(x, y, z);
      cubeGroup.add(foot);
    });

    // 6 Faceplate planes
    const faceConfigs = [
      { key: 'top',    pos: [0, 1.503, 0],  rot: [-Math.PI / 2, 0, 0] },
      { key: 'front',  pos: [0, 0, 1.503],  rot: [0, 0, 0] },
      { key: 'right',  pos: [1.503, 0, 0],  rot: [0, Math.PI / 2, 0] },
      { key: 'left',   pos: [-1.503, 0, 0], rot: [0, -Math.PI / 2, 0] },
      { key: 'back',   pos: [0, 0, -1.503], rot: [0, Math.PI, 0] },
      { key: 'bottom', pos: [0, -1.503, 0], rot: [Math.PI / 2, 0, 0] }
    ];

    const planeGeo = new THREE.PlaneGeometry(2.84, 2.84);
    for (const cfg of faceConfigs) {
      const tex = createFaceLayer(cfg.key);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.72, metalness: 0.04 });
      const mesh = new THREE.Mesh(planeGeo, mat);
      mesh.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
      mesh.rotation.set(cfg.rot[0], cfg.rot[1], cfg.rot[2]);
      mesh.userData = { face: cfg.key };
      cubeGroup.add(mesh);
      faceMeshes.push(mesh);
    }

    setupWebGLPointer(renderer.domElement);
    webglReady = true;
  } catch (err) {
    console.warn('WebGL fallback to Plate Mode:', err);
    setMode('plate');
  }
}

function updateCameraTransform() {
  if (!camera) return;
  const dist = 7.4 / Math.min(1, camera.aspect * 0.92);
  const cosEl = Math.cos(curEl);
  camera.position.set(
    dist * cosEl * Math.sin(curAz),
    dist * Math.sin(curEl),
    dist * cosEl * Math.cos(curAz)
  );
  camera.lookAt(0, 0, 0);
}

function setupWebGLPointer(dom) {
  let dragging = false;
  let downX = 0, downY = 0, lastX = 0, lastY = 0;
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  dom.addEventListener('pointerdown', e => {
    dragging = true;
    downX = lastX = e.clientX;
    downY = lastY = e.clientY;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging || state.mode !== '3d') return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    targetAz -= dx * 0.0065;
    targetEl = Math.max(-0.4, Math.min(1.52, targetEl + dy * 0.0055));
  });
  window.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    const travel = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (travel > 6 || state.mode !== '3d') return;

    const rect = dom.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(faceMeshes, false);
    if (!hits.length) return;

    const hit = hits[0];
    const face = hit.object.userData.face;
    const uv = hit.uv;
    if (!uv) return;

    // Convert Three.js UV (0..1 bottom-up) to top-down face coords, then to source image coords
    const fx = uv.x;
    const fy = 1 - uv.y;
    if (FACE_CROPS[face]) {
      const c = FACE_CROPS[face];
      const ix = c.x + fx * c.w;
      const iy = c.y + fy * c.h;
      handleFaceClick(face, ix, iy);
    } else if (face === 'back') {
      handleFaceClick('back', fx, fy);
    }
  });

  dom.addEventListener('dblclick', e => {
    const rect = dom.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(faceMeshes, false);
    if (hits.length && CAMERA_PRESETS[hits[0].object.userData.face]) {
      setFace(hits[0].object.userData.face);
    }
  });
}

function handleFaceClick(face, ix, iy) {
  const specs = BLUEPRINT_SPECS[face] || [];
  for (const s of specs) {
    const b = s.imgBox;
    if (ix >= b.x && ix <= b.x + b.w && iy >= b.y && iy <= b.y + b.h) {
      s.action();
      return;
    }
  }
  toast('已点击 ' + face.toUpperCase() + ' 面（双击可居中聚焦）');
}

/* =========================================================
   7. MODE 2: STUDIO PLATE + INTERACTIVE BLUEPRINT INSPECTOR
   ========================================================= */
function renderPlateStage() {
  const plateBox = document.getElementById('plate-box');
  const plateImg = document.getElementById('plate-img');
  const hotspots = document.getElementById('plate-hotspots');
  const callouts = document.getElementById('plate-callouts');
  const inspectorPanel = document.getElementById('inspector-panel');
  const inspectorList = document.getElementById('inspector-list');
  const inspectorTitle = document.getElementById('inspector-title');

  plateBox.classList.toggle('wide', state.face === 'left');
  if (state.face === 'back') {
    plateImg.style.display = 'none';
  } else {
    plateImg.style.display = 'block';
    plateImg.src = IMAGE_URLS[state.face] || IMAGE_URLS.hero;
  }

  const specs = BLUEPRINT_SPECS[state.face] || [];
  hotspots.innerHTML = '';
  callouts.innerHTML = '';
  inspectorList.innerHTML = '';

  inspectorTitle.textContent = state.face.toUpperCase() + ' · 逐键功能蓝图';
  inspectorPanel.classList.toggle('open', state.mode === 'plate' && state.inspect);

  specs.forEach(s => {
    const b = s.imgBox;
    const hs = document.createElement('div');
    hs.className = 'hotspot' + (state.highlightSpecId === s.id ? ' highlighted' : '');
    hs.style.left = (b.x * 100) + '%';
    hs.style.top = (b.y * 100) + '%';
    hs.style.width = (b.w * 100) + '%';
    hs.style.height = (b.h * 100) + '%';
    hs.title = s.name;
    hs.addEventListener('click', () => s.action());
    hs.addEventListener('mouseenter', () => setHighlightSpec(s.id));
    hotspots.appendChild(hs);

    if (state.inspect) {
      const pin = document.createElement('button');
      pin.type = 'button';
      pin.className = 'callout-pin' + (state.highlightSpecId === s.id ? ' active' : '');
      pin.textContent = s.num;
      pin.style.left = ((b.x + b.w * 0.5) * 100) + '%';
      pin.style.top = ((b.y + 0.025) * 100) + '%';
      pin.addEventListener('click', () => { setHighlightSpec(s.id); s.action(); });
      callouts.appendChild(pin);

      const item = document.createElement('div');
      item.className = 'spec-item' + (state.highlightSpecId === s.id ? ' active' : '');
      item.innerHTML = `
        <div class="spec-item-top">
          <span class="spec-num">${s.num}</span>
          <span class="spec-name">${s.name}</span>
          <span class="spec-route">${s.route}</span>
        </div>
        <div class="spec-desc">${s.desc}</div>
      `;
      item.addEventListener('click', () => { setHighlightSpec(s.id); s.action(); });
      item.addEventListener('mouseenter', () => setHighlightSpec(s.id));
      inspectorList.appendChild(item);
    }
  });
}

function setHighlightSpec(id) {
  state.highlightSpecId = id;
  if (state.mode === 'plate' && state.inspect) renderPlateStage();
}

function paintPlateLiveCanvas() {
  if (state.mode !== 'plate') return;
  const c = document.getElementById('plate-live-canvas');
  const ctx = c.getContext('2d');
  const W = c.width;
  const H = c.height;
  ctx.clearRect(0, 0, W, H);
  if (state.face === 'top') paintLiveTop(ctx, W, H, false);
  if (state.face === 'front') paintLiveFront(ctx, W, H, false);
  if (state.face === 'right') paintLiveRight(ctx, W, H, false);
  if (state.face === 'left') paintLiveLeft(ctx, W, H, false);
  if (state.face === 'back') ctx.drawImage(backBaseCanvas, 0, 0, W, H);
}

/* =========================================================
   8. MODE & FACE NAVIGATION
   ========================================================= */
function setMode(mode) {
  if (mode === '3d' && !webglReady) mode = 'plate';
  state.mode = mode;
  document.getElementById('mode-3d-btn').classList.toggle('active', mode === '3d');
  document.getElementById('mode-plate-btn').classList.toggle('active', mode === 'plate');
  document.getElementById('webgl-stage').classList.toggle('hidden', mode !== '3d');
  document.getElementById('plate-mode').classList.toggle('active', mode === 'plate');
  renderPlateStage();
}

function setFace(face) {
  playClickFoley(600);
  state.face = face;
  state.highlightSpecId = null;
  document.querySelectorAll('.face-btn[data-face]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.face === face);
  });
  const preset = CAMERA_PRESETS[face] || CAMERA_PRESETS.hero;
  targetAz = preset.az;
  targetEl = preset.el;
  renderPlateStage();
}

function toggleInspect() {
  playClickFoley(650);
  state.inspect = !state.inspect;
  const btn = document.getElementById('inspect-btn');
  btn.textContent = state.inspect ? '功能标注 ON' : '功能标注 OFF';
  btn.classList.toggle('orange-active', state.inspect);
  if (state.inspect && state.mode === '3d') {
    setMode('plate');
    toast('已切换至「正视实体机 + 标注」查看逐键说明');
  } else {
    renderPlateStage();
  }
}

/* Wire Controls */
document.getElementById('mode-3d-btn').addEventListener('click', () => { playClickFoley(); setMode('3d'); });
document.getElementById('mode-plate-btn').addEventListener('click', () => { playClickFoley(); setMode('plate'); });
document.getElementById('grille-cycle-btn').addEventListener('click', cycleGrilleMode);
document.getElementById('inspect-btn').addEventListener('click', toggleInspect);
document.getElementById('inspector-close').addEventListener('click', toggleInspect);
document.getElementById('sfx-btn').addEventListener('click', () => {
  state.sfx = !state.sfx;
  document.getElementById('sfx-btn').textContent = state.sfx ? 'SFX ON' : 'SFX OFF';
});
document.querySelectorAll('.face-btn[data-face]').forEach(btn => {
  btn.addEventListener('click', () => setFace(btn.dataset.face));
});
document.getElementById('open-dossier-btn').addEventListener('click', () => openDossier(state.albumIdx));
document.getElementById('close-dossier-btn').addEventListener('click', closeDossier);
document.getElementById('dossier-backdrop').addEventListener('click', e => {
  if (e.target.id === 'dossier-backdrop') closeDossier();
});
document.getElementById('dossier-disc').addEventListener('click', () => {
  state.albumIdx = state.dossierAlbumIdx;
  jumpTrack(0);
  closeDossier();
});
document.getElementById('load-disc-btn').addEventListener('click', () => {
  state.albumIdx = state.dossierAlbumIdx;
  jumpTrack(0);
  closeDossier();
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('dossier-backdrop').classList.contains('open')) closeDossier();
    else setFace('hero');
  } else if (e.key === ' ') {
    e.preventDefault();
    togglePlay();
  } else if (e.key.toLowerCase() === 'i') {
    toggleInspect();
  }
});

window.addEventListener('resize', () => {
  if (!webglReady) return;
  const c = document.getElementById('webgl-stage');
  camera.aspect = c.clientWidth / c.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(c.clientWidth, c.clientHeight);
});

/* =========================================================
   9. MAIN 60FPS ANIMATION LOOP
   ========================================================= */
let lastTs = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastTs) / 1000);
  lastTs = now;

  if (state.playing) {
    state.cdAngle += dt * 1.45 * (state.varispeed / 100);
    state.elapsed += dt * (state.varispeed / 100);
    if (state.elapsed >= currentTrack().dur) jumpTrack(state.trackIdx + 1);
  }

  // Synthesize smooth musical FFT spectrum for the 24x48 Grille LED Matrix
  const t = now * 0.001;
  for (let i = 0; i < 24; i++) {
    const bassWeight = Math.exp(-i * 0.075);
    const target = state.playing
      ? Math.min(1, Math.max(0.06, (0.28 + 0.56 * bassWeight) * (0.55 + 0.45 * Math.sin(t * (3.1 + i * 0.37) + i * 1.1))))
      : 0.03;
    state.spectrum[i] += (target - state.spectrum[i]) * 0.25;
    if (state.spectrum[i] > state.spectrumPeaks[i]) state.spectrumPeaks[i] = state.spectrum[i];
    else state.spectrumPeaks[i] = Math.max(0, state.spectrumPeaks[i] - dt * 0.42);
  }

  document.getElementById('hud-time').textContent = fmtTime(state.elapsed);

  if (state.mode === '3d' && webglReady) {
    // Smooth shortest-arc angular lerp
    const diffAz = ((targetAz - curAz + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    curAz += diffAz * 0.12;
    curEl += (targetEl - curEl) * 0.12;
    updateCameraTransform();

    ['top', 'front', 'right', 'left', 'back', 'bottom'].forEach(update3DFaceTexture);
    renderer.render(scene, camera);
  } else {
    paintPlateLiveCanvas();
  }
}

initThree();
syncHud();
renderPlateStage();
requestAnimationFrame(tick);
</script>
