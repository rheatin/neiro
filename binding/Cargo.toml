[package]
name = "neiro-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "neiro_audio"
path = "src/lib.rs"

[dependencies]
# The engine reports its device list as JSON. Parsing it on the Rust side keeps
# the C ABI free of struct-layout and packing concerns, which is the main thing
# that goes wrong when a C++ header and a Rust binding drift apart.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# none
