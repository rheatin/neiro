# macOS UI build: fetch the pinned neiro-core Release SDK and verify the UI crate & TSX.
name: macos

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable-aarch64-apple-darwin --profile minimal

      - name: Fetch prebuilt neiro-core SDK
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch-core.sh
          ./scripts/fetch-core.sh

      - name: Check UI Rust crate
        run: cargo check --manifest-path ui/Cargo.toml
