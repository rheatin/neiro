# Windows UI build: verify the UI crate & TSX. The neiro-core SDK lives in a
# private repository: with a `CORE_RELEASE_TOKEN` secret this job also fetches
# it and runs the engine integration test; without one the checks still run,
# as `cargo check`, `cargo test --lib` and `nsh check` compile only.
name: windows

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # A token that can read the private rheatin/neiro-core release assets.
      # The default GITHUB_TOKEN is scoped to this repository, so a download
      # from neiro-core answers 404 ("release not found").
      GH_TOKEN: ${{ secrets.CORE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Fetch prebuilt neiro-core SDK
        if: env.GH_TOKEN != ''
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-core.ps1

      - name: SDK not fetched (no CORE_RELEASE_TOKEN)
        if: env.GH_TOKEN == ''
        shell: pwsh
        run: Write-Host "::notice::CORE_RELEASE_TOKEN is not set, so the private neiro-core SDK is not fetched. The checks below compile and run lib tests only; add the secret to also run engine_shutdown."

      - name: Check UI Rust crate
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo check --manifest-path ui/Cargo.toml

      - name: Test UI Rust crate (lib)
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo test --manifest-path ui/Cargo.toml --lib

      - name: Test engine shutdown against the SDK
        if: env.GH_TOKEN != ''
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo test --manifest-path ui/Cargo.toml --test engine_shutdown

      - name: Check UI TSX (if nsh available)
        shell: pwsh
        run: |
          if (Get-Command nsh -ErrorAction SilentlyContinue) {
            Set-Location ui
            nsh check
          } else {
            Write-Host "nsh not installed in runner, skipping nsh check"
          }
