# Windows UI build: fetch the pinned neiro-core Release SDK and verify the UI crate & TSX.
name: windows

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Fetch prebuilt neiro-core SDK
        env:
          GH_TOKEN: ${{ secrets.CORE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-core.ps1

      - name: Check UI Rust crate
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo check --manifest-path ui/Cargo.toml
